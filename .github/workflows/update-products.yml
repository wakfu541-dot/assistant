name: Update affiliate product catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Import Awin product feeds
        env:
          AWIN_DATAFEED_API_KEY: ${{ secrets.AWIN_DATAFEED_API_KEY }}
          AWIN_MERCHANTS: ${{ vars.AWIN_MERCHANTS }}
          MAX_PRODUCTS: '5000'
          MAX_PRODUCTS_PER_FEED: '400'
        run: python scripts/import_awin.py

      - name: Publish catalogue changes
        run: |
          if git diff --quiet -- products.json products-meta.json; then
            echo "No catalogue changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json products-meta.json
          git commit -m "Update affiliate product catalogue"
          git push
