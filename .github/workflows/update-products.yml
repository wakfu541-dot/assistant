name: Update free public product catalogue

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_public_asos.py'
      - 'scripts/import_public_multi.py'
      - '.github/workflows/update-products.yml'
  schedule:
    - cron: '17 */12 * * *'

permissions:
  contents: write

jobs:
  update-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install lightweight HTTP client
        run: python -m pip install --disable-pip-version-check -q curl_cffi

      - name: Import public ASOS France catalogue
        env:
          MAX_PRODUCTS: '1200'
          ASOS_LIMIT_PER_CATEGORY: '36'
        run: python scripts/import_public_asos.py

      - name: Import 10 additional public retailers
        env:
          MAX_PER_SOURCE: '35'
          MAX_PAGES_PER_SOURCE: '40'
          FETCH_TIMEOUT: '18'
          FETCH_SLEEP: '0.12'
        run: python scripts/import_public_multi.py

      - name: Publish catalogue changes
        run: |
          if git diff --quiet -- products.json products-meta.json; then
            echo "No catalogue changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json products-meta.json
          git commit -m "Update zero-cost multi-retailer catalogue"
          git push
