name: Update free public product catalogue

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_public_asos.py'
      - 'scripts/import_public_retailers.py'
      - '.github/workflows/update-products.yml'
  schedule:
    - cron: '17 */12 * * *'

concurrency:
  group: public-catalogue-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Refresh public ASOS France catalogue
        if: github.event_name != 'push'
        env:
          MAX_PRODUCTS: '1200'
          ASOS_LIMIT_PER_CATEGORY: '36'
        run: python scripts/import_public_asos.py

      - name: Import additional public retailers
        env:
          MAX_PER_SOURCE: '12'
          MAX_PAGES_PER_SOURCE: '5'
          FETCH_TIMEOUT: '5'
          FETCH_SLEEP: '0.03'
        run: python scripts/import_public_retailers.py

      - name: Publish catalogue changes
        run: |
          if git diff --quiet -- products.json products-meta.json; then
            echo "No catalogue changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json products-meta.json
          git commit -m "Update zero-cost multi-retailer catalogue"
          git push
